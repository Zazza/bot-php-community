name: deploy

# Автодеплой на прод: push в main (или ручной запуск) → SSH на сервер
# под юзером phpbot → git reset --hard origin/main → пересборка бота → docker compose up -d.
# Действует строго в compose-проекте бота (/srv/php-bot); чужие контейнеры не затрагивает.
#
# Нативный ssh + pinned known_hosts (хост-ключ сервера зафиксирован в секрете SSH_KNOWN_HOSTS)
# вместо стороннего action — прозрачнее и строже проверки по fingerprint.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to prod (201.51.5.61, /srv/php-bot)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail
               cd /srv/php-bot
               git fetch --all --prune
               git reset --hard origin/main
               docker compose build --pull bot
               docker compose up -d
               echo '=== docker compose ps ==='
               docker compose ps
               docker image prune -f"
          rm -f ~/.ssh/id_ed25519
