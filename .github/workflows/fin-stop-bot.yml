name: fin-stop-bot
# Разовая остановка php-bot на фине перед переездом на DE (иначе два поллера
# одного TG-токена = 409 Conflict).
on:
  workflow_dispatch:
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop bot on fin
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_HOST" \
              'cd /srv/php-bot && docker compose stop bot && echo BOT-STOPPED && docker compose ps --format "{{.Name}} {{.Status}}"'
          rm -f ~/.ssh/id_ed25519
