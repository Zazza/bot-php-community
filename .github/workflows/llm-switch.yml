name: llm-switch

# Переключение PHPBOT_LLM_URL бота на проде (инцидент 18.09.2026: прод не достёгивается
# до РФ-хостов напрямую; LLM ходит через wg-туннель Timeweb↔VPS и прокладку llm-proxy
# на Timeweb, 10.8.0.2:8443 → api.vsellm.ru, /srv/llm-proxy/).
# Preflight: реальный chat-completion с ключом ИЗ .env прода — если новый URL не отвечает,
# .env не трогается. Откат: llm_url=https://api.vsellm.ru/v1 (прямой, работает только
# если РФ перестанет резать VPS) — или восстановить .env.bak-* на проде.
# Запуск: gh workflow run llm-switch.yml -f llm_url=http://10.8.0.2:8443/v1

on:
  workflow_dispatch:
    inputs:
      llm_url:
        description: 'Новый PHPBOT_LLM_URL'
        required: true
        default: 'http://10.8.0.2:8443/v1'

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preflight and apply
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          LLM_URL: ${{ github.event.inputs.llm_url }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" <<REMOTE
          set -euo pipefail
          cd /srv/php-bot
          KEY=\$(grep "^PHPBOT_LLM_API_KEY=" .env | cut -d= -f2-)
          code=\$(curl -sS -m 90 -o /tmp/pf.json -w '%{http_code}' "\$LLM_URL/chat/completions" \
            -H "Authorization: Bearer \$KEY" -H 'Content-Type: application/json' \
            -d '{"model":"openai/gpt-4o-mini","max_tokens":5,"messages":[{"role":"user","content":"ping"}]}')
          if [ "\$code" != 200 ]; then
            echo "PREFLIGHT FAIL: http=\$code — \$LLM_URL не работает, .env НЕ тронут"
            head -c 300 /tmp/pf.json 2>/dev/null || true
            rm -f /tmp/pf.json
            exit 1
          fi
          echo "PREFLIGHT OK: \$LLM_URL chat completion 200"
          rm -f /tmp/pf.json
          cp .env ".env.bak-\$(date +%Y%m%d%H%M%S)"
          if grep -q '^PHPBOT_LLM_URL=' .env; then
            sed -i "s|^PHPBOT_LLM_URL=.*|PHPBOT_LLM_URL=\$LLM_URL|" .env
          else
            printf 'PHPBOT_LLM_URL=%s\n' "\$LLM_URL" >> .env
          fi
          docker compose up -d bot
          sleep 10
          echo '=== bot logs (tail 12) ==='
          docker compose logs --tail 12 bot
          REMOTE
          rm -f ~/.ssh/id_ed25519
