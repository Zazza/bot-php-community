name: observe

# Ручной read-only взгляд глубже healthcheck: счётчики событий в логах бота за период
# и агрегаты из БД (сколько сообщений/викторин/спам-флагов). Репо публичный — НИКАКИХ
# текстов сообщений, юзернеймов и user_id в вывод: только числа и метки.
# Запуск: gh workflow run observe.yml
on:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Prod observe (read-only, aggregates only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /srv/php-bot
          PSGL="psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc"

          echo '=== container ==='
          docker inspect php-bot --format 'status={{.State.Status}} restarts={{.RestartCount}} started={{.State.StartedAt}}'

          echo '=== ERROR count ==='
          docker logs php-bot 2>&1 | grep -cE 'level=ERROR' || true
          echo '=== WARN count ==='
          docker logs php-bot 2>&1 | grep -cE 'level=WARN' || true

          echo '=== event labels (top) ==='
          docker logs php-bot 2>&1 | grep -oE 'msg="[a-z ]+"' | sort | uniq -c | sort -rn | head -15 || true

          echo '=== ERROR lines (scrubbed) ==='
          docker logs php-bot 2>&1 | grep -E 'level=ERROR' | tail -5 | sed -E 's/[0-9]{5,}/<id>/g' || true

          echo '=== chat: messages per hour (6h back) ==='
          docker exec php-bot-db sh -c "$PSGL \"SELECT extract(hour from ts)::int AS h, count(*) FROM messages WHERE chat_id=-1001120236018 AND ts > now() - make_interval(hours => 6) GROUP BY 1 ORDER BY 1;\""

          echo '=== chat: minutes since last message ==='
          docker exec php-bot-db sh -c "$PSGL \"SELECT coalesce(round(extract(epoch from (now() - max(ts)))/60)::int, -1) FROM messages WHERE chat_id=-1001120236018;\""

          echo '=== quizzes today / last kinds ==='
          docker exec php-bot-db sh -c "$PSGL \"SELECT count(*) FROM quizzes WHERE created_at >= current_date;\""
          docker exec php-bot-db sh -c "$PSGL \"SELECT kind FROM quizzes ORDER BY id DESC LIMIT 5;\""

          echo '=== spam_flags 24h by action ==='
          docker exec php-bot-db sh -c "$PSGL \"SELECT action, count(*) FROM spam_flags WHERE detected_at > now() - make_interval(hours => 24) GROUP BY action;\""
          REMOTE
          rm -f ~/.ssh/id_ed25519
