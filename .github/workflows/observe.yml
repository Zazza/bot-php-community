name: observe

# Ручной read-only взгляд глубже healthcheck: счётчики событий в логах бота за период
# и агрегаты из БД (сколько сообщений/викторин/спам-флагов). Репо публичный — НИКАКИХ
# текстов сообщений, юзернеймов и user_id в вывод: только числа и метки.
# Запуск: gh workflow run observe.yml --ref <ветка>
on:
  workflow_dispatch:

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Prod observe (read-only, aggregates only)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail
               cd /srv/php-bot
               echo '=== container ==='
               docker inspect php-bot --format 'status={{.State.Status}} restarts={{.RestartCount}} started={{.State.StartedAt}}'
               echo '=== log levels since start ==='
               docker logs php-bot 2>&1 | grep -cE 'level=ERROR' || true
               docker logs php-bot 2>&1 | grep -cE 'level=WARN' || true
               echo '=== event labels (top) ==='
               docker logs php-bot 2>&1 | grep -oE 'msg=\"[a-z ]+\"' | sort | uniq -c | sort -rn | head -15 || true
               echo '=== ERROR lines (scrubbed) ==='
               docker logs php-bot 2>&1 | grep -E 'level=ERROR' | tail -5 | sed -E 's/[0-9]{5,}/<id>/g' || true
               echo '=== messages per 2h (6h back) ==='
               docker exec php-bot-db sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"SELECT to_char(date_trunc(\x27hour\x27, created_at),\x27DD HH24h\x27) || \x27: \x27 || count(*) FROM messages WHERE chat_id=-1001120236018 AND created_at > now() - interval \x276 hours\x27 GROUP BY 1 ORDER BY 1;\"'
               echo '=== quizzes today + last kinds ==='
               docker exec php-bot-db sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"SELECT count(*) FROM quizzes WHERE created_at >= date_trunc(\x27day\x27, now());\"'
               docker exec php-bot-db sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"SELECT kind FROM quizzes ORDER BY id DESC LIMIT 5;\"'
               echo '=== spam_flags 24h by action ==='
               docker exec php-bot-db sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"SELECT action || \x27: \x27 || count(*) FROM spam_flags WHERE detected_at > now() - interval \x2724 hours\x27 GROUP BY action;\"'
               echo '=== last message age (chat) ==='
               docker exec php-bot-db sh -c 'psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -tAc \"SELECT round(extract(epoch from (now() - max(created_at)))/60) || \x27 min ago\x27 FROM messages WHERE chat_id=-1001120236018;\"'"
          rm -f ~/.ssh/id_ed25519
