name: wallpapers

# Доставка пула обоев на прод (/srv/php-bot/wallpapers) из release-asset.
# Запуск вручную (workflow_dispatch). SSH с домашних машин на VPS фильтруется
# (banner-timeout), GitHub-раннеры проходят — тот же канал и секреты, что deploy.yml.
# Пул: релиз wallpapers-v2, asset wallpapers-v2.tar → tar -xf в /srv/php-bot.
# v2 (2026-09-10): пул 42→30 работ — убраны нетематичные city/macro/mountains/retro;
# остались desk/minimal/space/terminal. Идемпотентен: повторный запуск перезаписывает
# файлы (tar overwrite) и вычищает исключённые темы, бот не трогается.

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deliver wallpapers to prod (/srv/php-bot/wallpapers)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          # VPS тянет ассет сам с GitHub CDN — раннер ничего не качает
          # (прокачка 205МБ через раннер не уложилась в таймаут джобы).
          # Одноразовый токен джобы (repo-scoped, живёт до конца job) уходит на
          # VPS по stdin — не светится в ps/логах.
          ASSET_API=$(gh api "repos/$GH_REPO/releases/tags/wallpapers-v2" --jq '.assets[0].url')
          printf '%s\n' "$GH_TOKEN" | ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -euo pipefail
               read -r tok
               # tar -xf не удаляет темы, исключённые из нового ассета — вычищаем
               # убранные в v2 (каталог обоев не пересоздаём: inode держит bind-mount
               # контейнера, замена = пустой /app/wallpapers до рестарта).
               rm -rf /srv/php-bot/wallpapers/city \
                      /srv/php-bot/wallpapers/macro \
                      /srv/php-bot/wallpapers/mountains \
                      /srv/php-bot/wallpapers/retro
               mkdir -p /srv/php-bot/wallpapers
               # wallpapers/ создал dockerd от root (bind-mount при первом деплое
               # до появления каталога) — phpbot писать не может. Чиним владельца
               # одноразовым контейнером (phpbot в docker-группе, как в deploy).
               docker run --rm -v /srv/php-bot/wallpapers:/w alpine:3 \
                   chown -R \"\$(id -u):\$(id -g)\" /w
               curl -fsSL --retry 3 \
                   -H \"Authorization: Bearer \$tok\" \
                   -H 'Accept: application/octet-stream' \
                   '$ASSET_API' -o /tmp/wallpapers-v2.tar
               tar -xf /tmp/wallpapers-v2.tar -C /srv/php-bot
               rm -f /tmp/wallpapers-v2.tar
               echo '=== pool check ==='
               echo \"4k:   \$(find /srv/php-bot/wallpapers -name '*-4k.png' | wc -l)\"
               echo \"phone: \$(find /srv/php-bot/wallpapers -name '*-phone.png' | wc -l)\"
               echo \"prev:  \$(find /srv/php-bot/wallpapers -path '*/preview/*.jpg' | wc -l)\""
          rm -f ~/.ssh/id_ed25519
